# CPU only (a few cores). This is the config of the overnight run that produced the
# first bot; on a GPU use gpu.yaml (you can resume this run's checkpoints with it).
blocks: 6
channels: 64
sims: 64
sims_fast: 16
p_full: 0.25
c_puct: 2.0
fpu_reduction: 0.2
fpu_root: 0.0
dirichlet_alpha: 0.1
dirichlet_frac: 0.25
temp_plies: 30
max_plies: 300
topk: 128
games_per_gen: 64
parallel: 64
variants: [drop, crazy]
material_blend: 0.5
blend_full_gens: 40
blend_zero_gen: 100
adjudicate_gens: 10
buffer_size: 200000
min_buffer: 4000
batch_size: 256
sample_reuse: 16
min_steps: 40
max_steps: 400
lr: 0.001
lr_min_frac: 0.1
weight_decay: 0.0001
value_weight: 1.0
value_q_mix: 0.5
mirror_augment: true
amp: false
eval_every: 10
eval_games: 30
eval_sims: 64
eval_temp_plies: 8
eval_parallel: 120
generations: 1000
keep_checkpoints: 0
