[package]
name = "dropchess-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the Drop Chess engine: rules, state encoding and batched MCTS for training"

[lib]
name = "dropchess"
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { package = "dropchess", path = "../engine" }
pyo3 = "0.30"
numpy = "0.30"
rayon = "1"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
